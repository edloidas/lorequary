packages:
  - packages/*
catalog:
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  # Must match the vitest that vite-plus bundles; `vp toolchain` prints it.
  '@vitest/coverage-v8': 4.1.11
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
allowBuilds:
  esbuild: true
  unrs-resolver: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@typescript/native-preview'
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
